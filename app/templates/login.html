{% extends "base.html" %}
{% block title %}로그인 - Pudin{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>로그인</h1>
  <p class="auth-subtitle">PDF 위에서 나만의 메모를 정리해 보세요.</p>

  <form id="login-form" class="auth-form">
    <div class="form-group">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" required placeholder="name@example.com" />
    </div>

    <div class="form-group">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" required placeholder="비밀번호를 입력하세요" />
    </div>

    <p id="error-msg" class="error-text" aria-live="polite"></p>
    <button type="submit" class="btn-primary">로그인</button>
  </form>

  <p class="auth-footer">
    아직 계정이 없나요? <a href="/signup">회원가입</a>
  </p>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
