{% extends "base.html" %}
{% block title %}회원가입 - Pudin{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>회원가입</h1>
  <p class="auth-subtitle">푸딩 계정을 만들고 학습 노트를 시작해 보세요.</p>

  <form id="signup-form" class="auth-form">
    <div class="form-group">
      <label for="nickname">닉네임</label>
      <input id="nickname" name="nickname" type="text" maxlength="50" required placeholder="푸딩" />
    </div>

    <div class="form-group">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" required placeholder="name@example.com" />
    </div>

    <div class="form-group">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" minlength="6" required placeholder="6자 이상 입력해 주세요" />
    </div>

    <p id="error-msg" class="error-text" aria-live="polite"></p>
    <button type="submit" class="btn-primary">회원가입</button>
  </form>

  <p class="auth-footer">
    이미 계정이 있나요? <a href="/login">로그인</a>
  </p>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
